# Ingredient catalog. Loaded by `python -m app.seed` (upsert by id).
#
# nutrients_per_100g follows EU labelling (Reg. (EU) 1169/2011): carbs_g excludes fibre, sugar_g is all
#   mono- and disaccharides (polyols excluded), energy factors 4/4/9 kcal for carbs/protein/fat,
#   2 kcal for fibre, 0 kcal for erythritol. Values are rounded reference figures (USDA / typical labels).
# sweetness_per_100g: sucrose-equivalent grams per 100 g (sugar = 100); a rough sensory estimate.
# price_per_kg_uah: INVENTED but plausible 2026 wholesale-ish prices for a small Ukrainian producer;
#   price_source says where the order of magnitude comes from. Not market data.

